<path d="M978 25h12m18-10 12 11m0-11-12 11" stroke="#222" stroke-width="2"/>
<rect x="15" y="44" width="1010" height="192" fill="#091a16" stroke="#808080" stroke-width="2"/>
<path d="M170 118H870M170 143H870" stroke="#276048" stroke-width="2"/>
<path d="m843 113 8 5-8 5M197 138l-8 5 8 5" fill="none" stroke="#66c490" stroke-width="2"/>
<rect class="packet" x="175" y="113" width="10" height="10"/>
<rect class="reply" x="855" y="138" width="10" height="10"/>
<g fill="#102b22" stroke="#66c490" stroke-width="2">
<rect x="66" y="77" width="130" height="91" rx="2"/>
<rect x="326" y="77" width="130" height="91" rx="2"/>
<path d="M586 89c0-17 130-17 130 0v65c0 19-130 19-130 0Z"/>
<path d="M846 151h100c32 0 34-47 4-51-4-34-56-37-68-10-30-8-51 26-36 41-11 1-12 20 0 20Z"/>
</g>
<g fill="none" stroke="#66c490" stroke-width="2">
<path d="M67 97h128M587 89c0 18 129 18 129 0M587 119c0 18 129 18 129 0"/>
<path d="m366 112-12 12 12 12m50-24 12 12-12 12m-20-28-10 56"/>
</g>
