<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="270" viewBox="0 0 1040 270" role="img" aria-labelledby="title desc">
<title id="title">Athina's full-stack network</title>
<desc id="desc">A decorative 1990s network monitor. Green request and response packets travel between a browser, API, database and cloud. This animation is illustrative, not live telemetry.</desc>
<style>
text{font-family:Courier New,monospace}
.packet{fill:#8fffaa;animation:request 6s linear infinite}
.reply{fill:#38c98a;animation:reply 6s linear infinite}
@keyframes request{0%,8%{transform:translateX(0);opacity:0}10%{opacity:1}42%{transform:translateX(680px);opacity:1}44%,100%{transform:translateX(680px);opacity:0}}
@keyframes reply{0%,48%{transform:translateX(0);opacity:0}50%{opacity:1}88%{transform:translateX(-680px);opacity:1}90%,100%{transform:translateX(-680px);opacity:0}}
.led{animation:pulse 3s steps(1) infinite}
@keyframes pulse{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.packet,.reply,.led{animation:none}.packet{transform:translateX(330px)}.reply{transform:translateX(-330px)}}
</style>
