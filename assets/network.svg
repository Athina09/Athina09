<rect x="80" y="111" width="39" height="42" opacity=".35"/><rect x="129" y="111" width="52" height="5"/><rect x="129" y="124" width="42" height="5"/><rect x="129" y="137" width="48" height="5"/>
<rect class="led" x="435" y="151" width="7" height="7"/>
</g>
<g fill="#d2efdc" font-size="17" font-weight="bold" text-anchor="middle">
<text x="131" y="198">BROWSER</text><text x="391" y="198">API</text><text x="651" y="198">DATABASE</text><text x="911" y="198">CLOUD</text>
</g>
<g fill="#7aa98c" font-size="12" text-anchor="middle">
<text x="131" y="218">INTERFACE</text><text x="391" y="218">LOGIC</text><text x="651" y="218">PERSISTENCE</text><text x="911" y="218">DEPLOYMENT</text>
</g>
