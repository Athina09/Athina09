<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="180" viewBox="0 0 1040 180" role="img" aria-labelledby="t d"><title id="t">Saving progress — keep building</title><desc id="d">A retro floppy disk with an animated activity light, moving file blocks and a progress meter. A decorative closing animation.</desc>
<style>@keyframes blink{50%{opacity:.25}}@keyframes move{0%{transform:translateX(0);opacity:0}15%,80%{opacity:1}100%{transform:translateX(240px);opacity:0}}@keyframes bar{0%,10%{width:0}80%,100%{width:480px}}.led{animation:blink 1.2s steps(1) infinite}.packet{animation:move 3.5s linear infinite}.b{animation-delay:1.2s}.c{animation-delay:2.4s}.bar{animation:bar 7s steps(24) infinite}@media(prefers-reduced-motion:reduce){.led,.packet,.bar{animation:none}}</style>
